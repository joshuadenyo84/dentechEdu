<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | DENTECHSYSTEMS</title>
    <style>
        /* Base Reset & Typography */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Centered Box Wrapper */
        .login-container {
            width: 400px;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Branding Header */
        .login-header {
            background: #104030; /* Primary Django Admin Green */
            padding: 20px 24px;
            border-bottom: 4px solid #abdfc8; /* Light Accent Bar */
        }
        .login-header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }
        .login-header .sub-brand {
            color: #abdfc8;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Form Area styling */
        .login-form {
            padding: 24px;
        }
        .form-row {
            margin-bottom: 20px;
        }
        .form-row label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        /* Input fields exactly matching the clean border style */
        .form-row input[type="text"],
        .form-row input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }
        .form-row input:focus {
            border-color: #104030;
        }

        /* Django Style Errors */
        .errornote {
            font-size: 13px;
            font-weight: 700;
            display: block;
            padding: 10px 12px;
            margin: 0 0 20px 0;
            color: #ba2121;
            border: 1px solid #e3b0b0;
            background: #fff8f8;
            border-radius: 4px;
        }

        /* Submit Button Block */
        .submit-row {
            margin-top: 24px;
        }
        .submit-row button {
            background: #104030;
            color: #fff;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .submit-row button:hover {
            background: #092e20;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <h1>django</h1>
            <div class="sub-brand">DENTECHSYSTEMS</div>
        </div>

        <!-- Form Body -->
        <div class="login-form">
            
            {% if form.non_field_errors %}
            <div class="errornote">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="form-row">
                    <label for="id_username">Username:</label>
                    <input type="text" name="username" id="id_username" autocomplete="username" required>
                </div>

                <!-- Password Field -->
                <div class="form-row">
                    <label for="id_password">Password:</label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
                </div>

                <!-- Submit Button -->
                <div class="submit-row">
                    <button type="submit">Log In</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
