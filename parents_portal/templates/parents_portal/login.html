<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <form method="POST" class="bg-white p-8 rounded-xl shadow-md w-96 space-y-4">
        {% csrf_token %}
        <h2 class="text-xl font-bold text-blue-900"><i class="fa-solid fa-graduation-cap mr-2"></i>Parent Portal Sign-In</h2>
        {% if messages %}{% for msg in messages %}<p class="text-red-500 text-xs">{{ msg }}</p>{% endfor %}{% endif %}
        <div>
            <label class="text-xs text-gray-500 block mb-1">Student Admission Number</label>
            <input type="text" name="username" class="w-full border p-2 rounded" placeholder="e.g. DAN00001" required>
        </div>
        <div>
            <label class="text-xs text-gray-500 block mb-1">Student UPI Number</label>
            <input type="password" name="password" class="w-full border p-2 rounded" placeholder="e.g. Y5963T469" required>
        </div>
        <button class="w-full bg-blue-900 text-white py-2 rounded font-bold hover:bg-blue-800 transition">Access Dashboard</button>
    </form>
</body>
</html>
